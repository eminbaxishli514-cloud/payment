<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitPay AZ - Customer Payment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>Customer Payment</h1>
        <p>Scan this page for your shared amount and give it to the cashier or bank app.</p>
      </div>
    </header>

    <article class="panel card full-width">
      <h2>Payment details</h2>
      <div id="customerDetails"></div>
      <p><strong>NOTE:</strong> This page is generated by SplitPay AZ. Complete your payment with the cashier or your bank application.</p>
    </article>
  </div>

  <script>
    (async function () {
      async function fetchJson(path) {
        const res = await fetch(path);
        if (!res.ok) throw new Error('Failed to load');
        return res.json();
      }

      const params = new URLSearchParams(window.location.search);
      const tableId = params.get('tableId');
      const customerId = params.get('customerId');
      const container = document.getElementById('customerDetails');

      if (!tableId || !customerId) {
        container.innerHTML = '<p>Missing payment details.</p>';
        return;
      }

      try {
        const summary = await fetchJson(`/api/tables/${tableId}/summary`);
        const customer = summary.customerPayments.find((item) => item.customerId === customerId);
        if (!customer) {
          container.innerHTML = '<p>Customer share was not found.</p>';
        } else {
          container.innerHTML = `
            <div class="payment-card">
              <div>
                <h3>${customer.name}</h3>
                <p><strong>Table:</strong> ${summary.tableNumber}</p>
                <p><strong>Amount:</strong> ${customer.amount.toFixed(2)} AZN</p>
                <p><strong>Items:</strong></p>
                <ul>${customer.items.map((item) => `<li>${item.name} — ${item.price.toFixed(2)} AZN</li>`).join('')}</ul>
              </div>
            </div>
          `;
        }
      } catch (error) {
        container.innerHTML = `<p>Unable to load payment details: ${error.message}</p>`;
      }
    })();
  </script>
</body>
</html>
