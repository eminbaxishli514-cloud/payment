<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitPay AZ — Restaurant Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="hero-copy">
        <p class="eyebrow">Restaurant Configuration</p>
        <h1>Setup Your Restaurant</h1>
        <p class="hero-text">Configure your tables and menu to start splitting bills efficiently.</p>
      </div>
      <div class="logo">
        <img src="https://via.placeholder.com/80x80?text=Logo" alt="SplitPay AZ Logo" />
      </div>
    </header>

    <section class="grid-layout">
      <article class="panel card full-width">
        <div class="panel-head"><h2>Restaurant Details</h2><span>Set up your tables and menu</span></div>
        <label class="field-group">Number of Tables<input id="tablesCount" type="number" min="1" placeholder="10" /></label>
        <button class="button button-primary" id="btnSaveConfig">Save Configuration</button>
      </article>

      <article class="panel card full-width">
        <div class="panel-head"><h2>Menu Items</h2><span>Add your dishes and prices</span></div>
        <div id="menuList" class="list-box"></div>
        <div class="menu-form">
          <label class="field-group">Item Name<input id="menuName" type="text" placeholder="Meal 1" /></label>
          <label class="field-group">Price<input id="menuPrice" type="number" step="0.01" placeholder="5.00" /></label>
          <button class="button button-primary" id="btnAddMenuItem">Add Menu Item</button>
        </div>
      </article>

      <article class="panel card full-width">
        <div class="panel-head"><h2>Actions</h2></div>
        <div class="action-row">
          <button class="button button-secondary" id="btnGoToDashboard">Go to Dashboard</button>
        </div>
      </article>
    </section>
  </div>

  <script src="config.js"></script>
</body>
</html>
